version: 1

frontend:
  phases:
    preBuild:
      commands:
        - cd frontend
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: frontend/dist
    files:
      - '**/*'
  cache:
    paths:
      - frontend/node_modules/**/*

# Environment variables to set in the Amplify Console:
#   VITE_API_BASE = https://<api-id>.execute-api.ap-south-1.amazonaws.com/dev
