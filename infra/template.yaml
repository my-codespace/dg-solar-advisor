AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Description: >
  SunSwitch – DG-to-Solar Switch Advisor for Housing Societies
  Environmental Hacks x AWS Hackathon
  Targets: Air (DG pollution) + Waste & Energy (rooftop solar)

# ── Cost control note ────────────────────────────────────────────────────────
# All resources are sized for minimal spend on the AWS Free Tier / $200 credit:
#   Lambda: 128 MB, 10 s timeout, on-demand (no provisioned concurrency)
#   DynamoDB: PAY_PER_REQUEST (no provisioned capacity)
#   S3: lifecycle rule deletes uploads after 7 days
#   Bedrock: Claude Haiku (cheapest model); fallback template avoids charges
# Recommended: set a $10 billing alarm in AWS Cost Explorer / Budgets.
# ─────────────────────────────────────────────────────────────────────────────

Globals:
  Function:
    Runtime: python3.12
    Timeout: 30
    MemorySize: 256
    Environment:
      Variables:
        UPLOAD_BUCKET: !Ref UploadBucket
        REPORTS_TABLE: !Ref ReportsTable
        BEDROCK_MODEL_ID: !Ref BedrockModelId
        BEDROCK_REGION: !Ref BedrockRegion
        ALLOWED_ORIGIN: !Ref AllowedOrigin
        AWS_REGION_OVERRIDE: !Ref AWS::Region
    Layers:
      - !Ref SharedLayer

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]
    Description: Deployment environment

  BedrockModelId:
    Type: String
    Default: anthropic.claude-3-haiku-20240307-v1:0
    Description: >
      Amazon Bedrock model ID for report generation.
      Claude Haiku is cheapest. Change to claude-3-sonnet or claude-3-5-sonnet for higher quality.

  BedrockRegion:
    Type: String
    Default: us-east-1
    Description: Bedrock is not available in all regions; us-east-1 has broadest model coverage.

  AllowedOrigin:
    Type: String
    Default: '*'
    Description: CORS allowed origin. Set to your Amplify URL in production.

  ReportTtlDays:
    Type: Number
    Default: 90
    Description: Days before saved reports are auto-deleted (DynamoDB TTL).

Resources:

  # ── S3 Upload Bucket ─────────────────────────────────────────────────────
  UploadBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub sunswitch-uploads-${Environment}-${AWS::AccountId}
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ['*']
            AllowedMethods: [GET, PUT, POST, DELETE, HEAD]
            AllowedOrigins: ['*']
            MaxAge: 3600
      LifecycleConfiguration:
        Rules:
          - Id: DeleteUploadsAfter7Days
            Status: Enabled
            Prefix: uploads/
            ExpirationInDays: 7
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  # ── DynamoDB Reports Table ───────────────────────────────────────────────
  ReportsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub sunswitch-reports-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: false  # cost saving; enable in production
      SSESpecification:
        SSEEnabled: true

  # ── Lambda Layer (shared calculation code) ───────────────────────────────
  SharedLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub sunswitch-shared-${Environment}
      Description: SunSwitch shared calculation engine and utilities
      ContentUri: ../backend/shared/
      CompatibleRuntimes:
        - python3.12
      RetentionPolicy: Delete

  # ── API Gateway ──────────────────────────────────────────────────────────
  SunSwitchApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref Environment
      Cors:
        AllowMethods: "'GET,POST,OPTIONS'"
        AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key'"
        AllowOrigin: !Sub "'${AllowedOrigin}'"
      GatewayResponses:
        DEFAULT_4XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: !Sub "'${AllowedOrigin}'"
        DEFAULT_5XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: !Sub "'${AllowedOrigin}'"

  # ── Lambda: Analyze ──────────────────────────────────────────────────────
  AnalyzeFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub sunswitch-analyze-${Environment}
      CodeUri: ../backend/analyze/
      Handler: handler.handler
      Description: Runs full DG + solar + financial analysis
      Events:
        AnalyzePost:
          Type: Api
          Properties:
            RestApiId: !Ref SunSwitchApi
            Path: /analyze
            Method: POST
        AnalyzeOptions:
          Type: Api
          Properties:
            RestApiId: !Ref SunSwitchApi
            Path: /analyze
            Method: OPTIONS

  # ── Lambda: Extract Logbook ──────────────────────────────────────────────
  ExtractFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub sunswitch-extract-${Environment}
      CodeUri: ../backend/extract/
      Handler: handler.handler
      Description: Extracts data from DG logbook/bill images using Amazon Textract
      Timeout: 60
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - textract:AnalyzeDocument
              Resource: '*'
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
              Resource:
                - !Sub arn:aws:s3:::${UploadBucket}
                - !Sub arn:aws:s3:::${UploadBucket}/*
      Events:
        ExtractPost:
          Type: Api
          Properties:
            RestApiId: !Ref SunSwitchApi
            Path: /extract-logbook
            Method: POST
        PresignGet:
          Type: Api
          Properties:
            RestApiId: !Ref SunSwitchApi
            Path: /extract-logbook
            Method: GET
        ExtractOptions:
          Type: Api
          Properties:
            RestApiId: !Ref SunSwitchApi
            Path: /extract-logbook
            Method: OPTIONS

  # ── Lambda: Report (GET + POST) ─────────────────────────────────────────
  ReportFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub sunswitch-report-${Environment}
      CodeUri: ../backend/report/
      Handler: handler.handler
      Description: Saves/retrieves reports; generates Bedrock summaries
      Timeout: 60
      Environment:
        Variables:
          REPORT_TTL_DAYS: !Ref ReportTtlDays
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
              Resource: !GetAtt ReportsTable.Arn
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource:
                - !Sub arn:aws:bedrock:${BedrockRegion}::foundation-model/${BedrockModelId}
                - arn:aws:bedrock:*::foundation-model/*
      Events:
        ReportPost:
          Type: Api
          Properties:
            RestApiId: !Ref SunSwitchApi
            Path: /report
            Method: POST
        ReportGet:
          Type: Api
          Properties:
            RestApiId: !Ref SunSwitchApi
            Path: /report/{id}
            Method: GET
        ReportOptions:
          Type: Api
          Properties:
            RestApiId: !Ref SunSwitchApi
            Path: /report
            Method: OPTIONS
        ReportIdOptions:
          Type: Api
          Properties:
            RestApiId: !Ref SunSwitchApi
            Path: /report/{id}
            Method: OPTIONS

Outputs:
  ApiBaseUrl:
    Description: API Gateway base URL
    Value: !Sub https://${SunSwitchApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}
    Export:
      Name: !Sub SunSwitch-ApiBaseUrl-${Environment}

  UploadBucketName:
    Description: S3 bucket for DG logbook uploads
    Value: !Ref UploadBucket
    Export:
      Name: !Sub SunSwitch-UploadBucket-${Environment}

  ReportsTableName:
    Description: DynamoDB table for saved reports
    Value: !Ref ReportsTable
    Export:
      Name: !Sub SunSwitch-ReportsTable-${Environment}
