version: '3.8'

# SunSwitch local development with LocalStack
# Usage: docker-compose up
# Then run: cd frontend && npm run dev
# API available at: http://localhost:3000

services:
  localstack:
    image: localstack/localstack:latest
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3,dynamodb,textract,lambda,apigateway
      - AWS_DEFAULT_REGION=ap-south-1
      - DEBUG=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - localstack_data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  sam-local:
    image: public.ecr.aws/sam/build-python3.12:latest
    working_dir: /app
    volumes:
      - .:/app
    environment:
      - AWS_ENDPOINT_URL=http://localstack:4566
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=ap-south-1
      - UPLOAD_BUCKET=sunswitch-uploads-local
      - REPORTS_TABLE=sunswitch-reports-local
      - BEDROCK_MODEL_ID=anthropic.claude-3-haiku-20240307-v1:0
      - BEDROCK_REGION=us-east-1
      - ALLOWED_ORIGIN=http://localhost:5173
    command: >
      bash -c "pip install aws-sam-cli &&
               sam local start-api
               --template infra/template.yaml
               --host 0.0.0.0
               --port 3000
               --warm-containers EAGER"
    ports:
      - "3000:3000"
    depends_on:
      localstack:
        condition: service_healthy

volumes:
  localstack_data:

# Quick start:
#   docker-compose up -d
#   # In a separate terminal:
#   cd frontend && echo 'VITE_API_BASE=http://localhost:3000' > .env.local && npm run dev
